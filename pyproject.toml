[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoproj"
version = "2.1.2"
description = "High-precision 3D-to-2D projection engine (numpy + numba JIT)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FeiChangShuai", email = "FeiChangShuai@users.noreply.github.com"}
]
keywords = ["projection", "camera", "3d", "2d", "robotics", "computer-vision"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://autoproj.readthedocs.io/"
"Bug Reports" = "https://github.com/ShareByWangYang/autoproj/issues"
Source = "https://github.com/ShareByWangYang/autoproj"

[project.optional-dependencies]
# numba 为批量接口 (project_boxes/project_lines) 提供 JIT 加速
# 不安装时自动回退到 Python 循环路径
jit = ["numba>=0.57.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "numba>=0.57.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["autoproj*"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]
